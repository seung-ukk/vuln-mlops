apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: observability-lab}
spec: {selector: {app: prometheus}, ports: [{name: http, port: 9090, targetPort: http}]}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: observability-lab}
spec: {selector: {app: grafana}, ports: [{name: http, port: 3000, targetPort: http}]}
---
apiVersion: v1
kind: Service
metadata: {name: operations-log, namespace: observability-lab}
spec: {selector: {app: operations-log}, ports: [{name: metrics, port: 8080, targetPort: metrics}]}
