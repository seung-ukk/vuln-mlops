apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: validator-observability-reader, namespace: observability-lab}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: validator-observability-reader, namespace: observability-lab}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: validator-observability-reader}
subjects: [{kind: ServiceAccount, name: modelgate, namespace: modelgate-lab}]
