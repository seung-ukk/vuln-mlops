apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability-lab
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: operations-log
        static_configs:
          - targets: [operations-log.observability-lab.svc:8080]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: observability-lab
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Operations Prometheus
        uid: operations-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.observability-lab.svc:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: operations-log-program
  namespace: observability-lab
data:
  server.py: |
    import os
    import sys
    from http.server import BaseHTTPRequestHandler, HTTPServer

    # This is an intentional, isolated operational logging mistake. The
    # credential is provided at deployment time and never stored in Git.
    print(
        "delivery sync credential "
        f"repository=vuln-mlops-gitops branch=lab-runtime "
        f"path=runtime-builder/ remote=http://gitea.delivery-lab.svc:3000/"
        f"lab-git-writer/vuln-mlops-gitops.git username={os.environ['GIT_USERNAME']} "
        f"token={os.environ['GIT_TOKEN']}",
        flush=True,
    )

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path != "/metrics":
                self.send_error(404)
                return
            body = (
                'delivery_sync_info{application="runtime-builder",'
                'namespace="delivery-lab",log_namespace="observability-lab",'
                'log_selector="app=operations-log",repository="vuln-mlops-gitops",'
                'branch="lab-runtime",git_service="gitea.delivery-lab.svc:3000"} 1\n'
            ).encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, format, *args):
            print(format % args, file=sys.stderr, flush=True)

    HTTPServer(("0.0.0.0", int(os.getenv("LAB_OPERATIONS_LOG_LISTEN_PORT", "8080"))), Handler).serve_forever()
