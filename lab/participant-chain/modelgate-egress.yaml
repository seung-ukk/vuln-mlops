apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: validator-internal-investigation, namespace: modelgate-lab}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: modelgate}}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability-lab}}}]
      ports:
        - {protocol: TCP, port: 3000}
        - {protocol: TCP, port: 9090}
        - {protocol: TCP, port: 8080}
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: delivery-lab}}}]
      ports: [{protocol: TCP, port: 3000}]
    # EKS API may resolve to private control-plane endpoints outside the Pod CIDR.
    # The validator token is still bounded by its Kubernetes Role.
    - to: [{ipBlock: {cidr: 10.0.0.0/8}}]
      ports: [{protocol: TCP, port: 443}]
    - to: [{ipBlock: {cidr: 172.16.0.0/12}}]
      ports: [{protocol: TCP, port: 443}]
    - to: [{ipBlock: {cidr: 192.168.0.0/16}}]
      ports: [{protocol: TCP, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: validator-attacker-receiver, namespace: modelgate-lab}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: modelgate}}
  policyTypes: [Egress]
  egress:
    - to: [{ipBlock: {cidr: __ATTACKER_PRIVATE_IP__/32}}]
      ports: [{protocol: TCP}]
