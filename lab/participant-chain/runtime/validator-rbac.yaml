apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: validator-runtime-reader, namespace: runtime-lab}
rules:
  - {apiGroups: [apps], resources: [deployments], resourceNames: [runtime-builder], verbs: [get]}
  - {apiGroups: [""], resources: [pods], verbs: [get, list]}
  - {apiGroups: [""], resources: [pods/log], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: validator-runtime-reader, namespace: runtime-lab}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: validator-runtime-reader}
subjects: [{kind: ServiceAccount, name: modelgate, namespace: modelgate-lab}]
