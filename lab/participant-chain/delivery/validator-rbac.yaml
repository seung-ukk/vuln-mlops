apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: validator-delivery-reader, namespace: delivery-lab}
rules:
  - {apiGroups: [argoproj.io], resources: [applications], resourceNames: [runtime-builder], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: validator-delivery-reader, namespace: delivery-lab}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: validator-delivery-reader}
subjects: [{kind: ServiceAccount, name: modelgate, namespace: modelgate-lab}]
