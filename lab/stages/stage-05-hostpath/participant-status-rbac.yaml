apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: modelgate-stage-05-status, namespace: stage-05-runtime}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [runtime-builder]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: modelgate-stage-05-status, namespace: stage-05-runtime}
subjects:
  - kind: ServiceAccount
    name: modelgate
    namespace: modelgate-lab
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: modelgate-stage-05-status}
