apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: stage-05-runtime-builder-reconciler, namespace: stage-05-runtime}
rules:
  # The Argo dynamic cache must compare namespaced live objects. Mutation is a
  # separate resourceName rule and cannot create or delete workloads.
  - {apiGroups: ["*"], resources: ["*"], verbs: [get, list, watch]}
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [runtime-builder]
    verbs: [update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: stage-05-runtime-builder-reconciler, namespace: stage-05-runtime}
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: stage-04-gitops
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: stage-05-runtime-builder-reconciler}
