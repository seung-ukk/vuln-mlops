apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: stage-04-default-deny, namespace: stage-04-gitops}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: stage-04-internal, namespace: stage-04-gitops}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {}}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: stage-02-rbac}}
          podSelector: {matchLabels: {lab.vuln-mlops/role: stage-04-git-client}}
      ports: [{protocol: TCP, port: 3000}]
  egress:
    - to: [{podSelector: {}}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to: [{ipBlock: {cidr: 10.96.0.1/32}}]
      ports: [{protocol: TCP, port: 443}]
    - to: [{ipBlock: {cidr: 172.16.0.0/12}}]
      ports: [{protocol: TCP, port: 6443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: stage-04-git-client-egress, namespace: stage-02-rbac}
spec:
  podSelector: {matchLabels: {lab.vuln-mlops/role: stage-04-git-client}}
  policyTypes: [Egress]
  egress:
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: stage-04-gitops}}}]
      ports: [{protocol: TCP, port: 3000}]
