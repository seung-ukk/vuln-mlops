apiVersion: apps/v1
kind: Deployment
metadata: {name: gitea, namespace: stage-04-gitops}
spec:
  replicas: 1
  selector: {matchLabels: {app: gitea}}
  template:
    metadata: {labels: {app: gitea}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gitea
          image: gitea/gitea:1.27.3-rootless@sha256:1c17ecaead42eb3b5391553d8708103a4beb0e86edf5b9ebc1eb269c318845f2
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: GITEA__database__DB_TYPE, value: sqlite3}
            - {name: GITEA__server__ROOT_URL, value: "http://gitea.stage-04-gitops.svc:3000/"}
            - {name: GITEA__server__DISABLE_SSH, value: "true"}
            - {name: GITEA__service__DISABLE_REGISTRATION, value: "true"}
            - {name: GITEA__security__INSTALL_LOCK, value: "true"}
          readinessProbe: {httpGet: {path: /api/healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /api/healthz, port: http}, initialDelaySeconds: 20, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1, memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/gitea}
            - {name: config, mountPath: /etc/gitea}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: config, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: gitea, namespace: stage-04-gitops}
spec: {selector: {app: gitea}, ports: [{name: http, port: 3000, targetPort: http}]}
