apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: runtime-builder-ingress, namespace: stage-05-runtime}
spec:
  podSelector: {matchLabels: {app: runtime-builder}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: modelgate-lab}}
          podSelector: {matchLabels: {app.kubernetes.io/name: modelgate}}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: runtime-builder-iam-egress, namespace: stage-05-runtime}
spec:
  podSelector: {matchLabels: {app: runtime-builder}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{protocol: TCP, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: modelgate-runtime-builder-egress, namespace: modelgate-lab}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: modelgate}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: stage-05-runtime}}
          podSelector: {matchLabels: {app: runtime-builder}}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: runtime-builder-maintenance-egress, namespace: stage-05-runtime}
spec:
  podSelector: {matchLabels: {app: runtime-builder}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app: runtime-maintenance}}
      ports: [{protocol: TCP, port: 8080}]
