apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-session-config
  namespace: stage-02-rbac
data:
  default.conf: |
    server {
      listen 8080;
      access_log off;
      location = /healthz { return 200 'ok\n'; }
      location = /datasources {
        proxy_pass http://grafana.stage-03-monitoring.svc:3000/api/datasources;
      }
      location = /query {
        proxy_pass http://grafana.stage-03-monitoring.svc:3000/api/datasources/proxy/uid/stage3-prometheus/api/v1/query?query=gitops_debug_info;
      }
      location = /exchange/stage3-lab-repo-writer {
        proxy_pass http://credential-broker.stage-03-monitoring.svc:8080/exchange/stage3-lab-repo-writer;
      }
      location / { return 404; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-session
  namespace: stage-02-rbac
  labels: {lab.vuln-mlops/stage: "03"}
spec:
  replicas: 1
  selector: {matchLabels: {app: monitoring-session}}
  template:
    metadata:
      labels:
        app: monitoring-session
        lab.vuln-mlops/role: stage-03-client
    spec:
      serviceAccountName: monitoring-runner
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: relay
          image: nginxinc/nginx-unprivileged:1.29.1-alpine@sha256:27985295bdb22a1ef8f712863210bd5877c0f3006494a593e86b3fe0fa55467e
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: config, mountPath: /etc/nginx/conf.d, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: monitoring-session-config}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-session
  namespace: stage-02-rbac
spec:
  selector: {app: monitoring-session}
  ports: [{name: http, port: 8080, targetPort: http}]
