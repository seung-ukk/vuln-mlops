apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: stage-03-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: kubernetes-service-endpoints
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [stage-03-monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            target_label: __metrics_path__
          - source_labels: [__meta_kubernetes_service_name]
            target_label: kubernetes_service
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: stage-03-monitoring
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Stage 3 Prometheus
        uid: stage3-prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.stage-03-monitoring.svc:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: credential-broker-config
  namespace: stage-03-monitoring
data:
  default.conf: |
    server {
      listen 8080;
      access_log off;
      location = /metrics {
        default_type text/plain;
        return 200 'gitops_debug_info{broker="http://credential-broker.stage-03-monitoring.svc:8080",credential_ref="stage3-lab-repo-writer",repository="lab-git.internal/vuln-mlops-gitops",branch="stage4-lab",path="runtime-builder/",application="runtime-builder",destination="stage-04-gitops"} 1\n';
      }
      location = /exchange/stage3-lab-repo-writer {
        default_type application/json;
        return 200 '{"flag":"FLAG{stage_3_monitoring_trust_placeholder}","username":"stage3-lab-writer","token":"SYNTHETIC_STAGE3_GIT_TOKEN","repository":"lab-git.internal/vuln-mlops-gitops","branch":"stage4-lab","path":"runtime-builder/","application":"runtime-builder","destination":"stage-04-gitops"}\n';
      }
      location / { return 404; }
    }
