apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: stage-03-monitoring}
spec: {selector: {app: prometheus}, ports: [{name: http, port: 9090, targetPort: http}]}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: stage-03-monitoring}
spec: {selector: {app: grafana}, ports: [{name: http, port: 3000, targetPort: http}]}
---
apiVersion: v1
kind: Service
metadata:
  name: credential-broker
  namespace: stage-03-monitoring
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
spec: {selector: {app: credential-broker}, ports: [{name: http, port: 8080, targetPort: http}]}
