apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-builder
  namespace: stage-05-runtime
  labels: {lab.vuln-mlops/stage: "05"}
spec:
  replicas: 1
  selector: {matchLabels: {app: runtime-builder}}
  template:
    metadata: {labels: {app: runtime-builder}}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {lab.vuln-mlops/node-role: escape}
      tolerations:
        - {key: lab.vuln-mlops/escape, operator: Equal, value: "true", effect: NoSchedule}
      securityContext: {runAsUser: 0, runAsGroup: 0, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: runtime-builder
          image: ghcr.io/seung-ukk/vuln-mlops-runtime-client@sha256:556d3f1837edfcd0da44627a39dbe890822217c66b1beec2d31f5ff6c48a930b
          command: [sleep, infinity]
          env:
            - {name: STAGE4_MODE, value: baseline}
            - {name: STAGE5_MODE, value: socket-present}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: runtime-socket, mountPath: /run/stage5/containerd.sock}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: runtime-socket
          hostPath: {path: /run/containerd/containerd.sock, type: Socket}
        - {name: tmp, emptyDir: {}}
