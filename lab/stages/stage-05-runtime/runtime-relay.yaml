apiVersion: v1
kind: ConfigMap
metadata: {name: runtime-relay, namespace: stage-05-runtime}
data:
  runtime-relay.py: |
    import json
    import os
    import re
    import subprocess
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from pathlib import Path

    CRICTL = "/tools/crictl"
    SOCKET = "unix:///run/stage5/containerd.sock"
    PROOF_PATTERN = re.compile(r"FLAG\{stage_5_[a-z0-9_]+\}")
    RELAY_HEADER = "SYNTHETIC_STAGE5_RUNTIME_RELAY"
    OUTPUT = Path("/tmp/stage5-proof")
    LOCK = threading.Lock()

    def crictl(*arguments, timeout=120):
        result = subprocess.run(
            [CRICTL, "--runtime-endpoint=" + SOCKET, "--image-endpoint=" + SOCKET,
             "--timeout=120s", *arguments],
            check=True, capture_output=True, text=True, timeout=timeout,
        )
        return result.stdout.strip()

    def execute_proof():
        pod_name = os.environ["POD_NAME"]
        pod_uid = os.environ["POD_UID"]
        proof_image = os.environ["PROOF_IMAGE"]
        sandboxes = crictl(
            "pods", "--name", pod_name, "--state", "Ready", "--quiet"
        ).splitlines()
        if not sandboxes:
            raise RuntimeError("current Pod sandbox was not found")

        pod_config = {
            "metadata": {"name": pod_name, "namespace": "stage-05-runtime",
                         "uid": pod_uid, "attempt": 0},
            "log_directory": "/tmp", "linux": {"cgroup_parent": "system.slice"},
        }
        container_config = {
            "metadata": {"name": "stage5-proof", "attempt": 1},
            "image": {"image": proof_image},
            "command": ["sh", "-c", "cp /proof/stage-05-proof /out/stage5-proof"],
            "log_path": "stage5-proof.log",
            "mounts": [
                {"container_path": "/proof", "host_path": "/var/lib/vuln-mlops",
                 "readonly": True},
                {"container_path": "/out",
                 "host_path": "/var/lib/kubelet/pods/" + pod_uid +
                              "/volumes/kubernetes.io~empty-dir/tmp",
                 "readonly": False},
            ],
            "linux": {"security_context": {"privileged": False}},
        }
        Path("/tmp/stage5-pod.json").write_text(json.dumps(pod_config))
        Path("/tmp/stage5-container.json").write_text(json.dumps(container_config))
        OUTPUT.unlink(missing_ok=True)
        container_id = crictl(
            "create", sandboxes[0], "/tmp/stage5-container.json", "/tmp/stage5-pod.json"
        )
        try:
            crictl("start", container_id)
            for _ in range(100):
                if OUTPUT.exists():
                    proof = OUTPUT.read_text().strip()
                    if PROOF_PATTERN.fullmatch(proof) is None:
                        raise RuntimeError("unexpected synthetic proof")
                    return {"proof": "runtime", "success": True,
                            "evidence": "synthetic escape-node proof observed",
                            "flag": proof}
                time.sleep(0.1)
            raise RuntimeError("synthetic proof was not observed")
        finally:
            subprocess.run(
                [CRICTL, "--runtime-endpoint=" + SOCKET, "--timeout=120s",
                 "rm", container_id], capture_output=True, timeout=120,
            )
            OUTPUT.unlink(missing_ok=True)

    class Handler(BaseHTTPRequestHandler):
        def respond(self, status, payload):
            body = json.dumps(payload, separators=(",", ":")).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/healthz":
                self.respond(200, {"status": "ok"})
            else:
                self.respond(404, {"detail": "not found"})

        def do_POST(self):
            if self.path != "/proof":
                self.respond(404, {"detail": "not found"})
                return
            if os.environ.get("RELAY_ENABLED") != "true":
                self.respond(409, {"detail": "runtime relay is not enabled"})
                return
            if self.headers.get("X-ModelGate-Relay") != RELAY_HEADER:
                self.respond(403, {"detail": "relay identity denied"})
                return
            if (self.headers.get("Transfer-Encoding") or
                    self.headers.get("Content-Length", "0") != "0"):
                self.respond(400, {"detail": "request body is forbidden"})
                return
            if not LOCK.acquire(blocking=False):
                self.respond(409, {"detail": "proof operation is already running"})
                return
            try:
                self.respond(200, execute_proof())
            except Exception:
                self.respond(502, {"detail": "runtime proof operation failed"})
            finally:
                LOCK.release()

        def log_message(self, format, *args):
            return

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: v1
kind: Service
metadata: {name: runtime-relay, namespace: stage-05-runtime}
spec:
  selector: {app: runtime-builder}
  ports: [{name: http, port: 8080, targetPort: relay}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: runtime-relay-ingress, namespace: stage-05-runtime}
spec:
  podSelector: {matchLabels: {app: runtime-builder}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: modelgate-lab}}
          podSelector: {matchLabels: {app.kubernetes.io/name: modelgate}}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: modelgate-runtime-relay-egress, namespace: modelgate-lab}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: modelgate}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: stage-05-runtime}}
          podSelector: {matchLabels: {app: runtime-builder}}
      ports: [{protocol: TCP, port: 8080}]
