apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: stage-05-runtime-builder-only}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - {apiGroups: [apps], apiVersions: [v1], operations: [UPDATE], resources: [deployments], scope: Namespaced}
  matchConditions:
    - {name: controller-only, expression: "request.namespace == 'stage-05-runtime' && request.userInfo.username == 'system:serviceaccount:stage-04-gitops:argocd-application-controller'"}
  validations:
    - {expression: "object.metadata.name == 'runtime-builder' && object.spec.replicas == 1", message: "Argo CD may update only one runtime-builder replica."}
    - {expression: "object.spec.template.spec.nodeSelector == {'lab.vuln-mlops/node-role': 'escape'}", message: "runtime-builder must stay on the escape node."}
    - {expression: "object.spec.template.spec.tolerations.size() == 1 && object.spec.template.spec.tolerations[0].key == 'lab.vuln-mlops/escape' && object.spec.template.spec.tolerations[0].value == 'true' && object.spec.template.spec.tolerations[0].effect == 'NoSchedule'", message: "The escape-node toleration is fixed."}
    - {expression: "!has(object.spec.template.spec.hostNetwork) && !has(object.spec.template.spec.hostPID) && !has(object.spec.template.spec.hostIPC)", message: "Host namespaces are forbidden."}
    - {expression: "object.spec.template.spec.automountServiceAccountToken == false", message: "A Kubernetes token is forbidden."}
    - {expression: "object.spec.template.spec.containers.size() == 1 && object.spec.template.spec.containers[0].name == 'runtime-builder' && object.spec.template.spec.containers[0].image == 'debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251'", message: "The runtime-builder image and container shape are fixed."}
    - {expression: "(!has(object.spec.template.spec.containers[0].securityContext.privileged) || object.spec.template.spec.containers[0].securityContext.privileged == false) && object.spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation == false && object.spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem == true", message: "Privileged execution is forbidden."}
    - {expression: "object.spec.template.spec.volumes.size() == 3 && object.spec.template.spec.volumes.exists_one(v, v.name == 'runtime-socket' && has(v.hostPath) && v.hostPath.path == '/run/containerd/containerd.sock' && v.hostPath.type == 'Socket') && object.spec.template.spec.volumes.exists_one(v, v.name == 'runtime-client' && has(v.hostPath) && v.hostPath.path == '/usr/local/bin/crictl' && v.hostPath.type == 'File') && object.spec.template.spec.volumes.exists_one(v, v.name == 'tmp' && has(v.emptyDir))", message: "Only the exact containerd socket, runtime client, and tmp volumes are allowed."}
    - {expression: "object.spec.template.spec.containers[0].volumeMounts.size() == 3 && object.spec.template.spec.containers[0].volumeMounts.exists_one(v, v.name == 'runtime-socket' && v.mountPath == '/run/stage5/containerd.sock') && object.spec.template.spec.containers[0].volumeMounts.exists_one(v, v.name == 'runtime-client' && v.mountPath == '/usr/local/bin/crictl' && v.readOnly == true) && object.spec.template.spec.containers[0].volumeMounts.exists_one(v, v.name == 'tmp' && v.mountPath == '/tmp')", message: "Runtime socket and client mounts are fixed."}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: stage-05-runtime-builder-only}
spec: {policyName: stage-05-runtime-builder-only, validationActions: [Deny, Audit]}
