apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: stage-05-runtime-builder-only}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - {apiGroups: [apps], apiVersions: [v1], operations: [UPDATE], resources: [deployments], scope: Namespaced}
  matchConditions:
    - {name: controller-only, expression: "request.namespace == 'stage-05-runtime' && request.userInfo.username == 'system:serviceaccount:stage-04-gitops:argocd-application-controller'"}
  validations:
    - {expression: "object.metadata.name == 'runtime-builder' && object.spec.replicas == 1", message: "Argo CD may update only one runtime-builder replica."}
    - {expression: "object.spec.template.spec.nodeSelector == {'lab.vuln-mlops/node-role': 'escape'}", message: "runtime-builder must stay on the escape node."}
    - {expression: "object.spec.template.spec.tolerations.size() == 1 && object.spec.template.spec.tolerations[0].key == 'lab.vuln-mlops/escape' && object.spec.template.spec.tolerations[0].value == 'true' && object.spec.template.spec.tolerations[0].effect == 'NoSchedule'", message: "The escape-node toleration is fixed."}
    - {expression: "!has(object.spec.template.spec.hostNetwork) && !has(object.spec.template.spec.hostPID) && !has(object.spec.template.spec.hostIPC)", message: "Host namespaces are forbidden."}
    - {expression: "object.spec.template.spec.automountServiceAccountToken == false", message: "A Kubernetes token is forbidden."}
    - {expression: "object.spec.template.spec.initContainers.size() == 1 && object.spec.template.spec.initContainers[0].name == 'install-crictl' && object.spec.template.spec.initContainers[0].image == 'ghcr.io/seung-ukk/vuln-mlops-runtime-client@sha256:556d3f1837edfcd0da44627a39dbe890822217c66b1beec2d31f5ff6c48a930b' && object.spec.template.spec.initContainers[0].command == ['cp', '/usr/local/bin/crictl', '/tools/crictl']", message: "The crictl installer is fixed."}
    - {expression: "object.spec.template.spec.containers.size() == 2 && object.spec.template.spec.containers[0].name == 'runtime-builder' && object.spec.template.spec.containers[0].image == 'ghcr.io/seung-ukk/vuln-mlops-runtime-client@sha256:556d3f1837edfcd0da44627a39dbe890822217c66b1beec2d31f5ff6c48a930b' && object.spec.template.spec.containers[0].command == ['sleep', 'infinity'] && object.spec.template.spec.containers[1].name == 'runtime-relay' && object.spec.template.spec.containers[1].image == 'ghcr.io/seung-ukk/vuln-mlops@sha256:8f0a902437e5f276e4c316fdb7d77b0f955337c075199b8c221a9193b2158da9' && object.spec.template.spec.containers[1].command == ['python', '/relay/runtime-relay.py']", message: "The runtime-builder and relay containers are fixed."}
    - {expression: "object.spec.template.spec.containers[1].ports.size() == 1 && object.spec.template.spec.containers[1].ports[0].name == 'relay' && object.spec.template.spec.containers[1].ports[0].containerPort == 8080 && object.spec.template.spec.containers[1].env.size() == 4 && object.spec.template.spec.containers[1].env.exists_one(e, e.name == 'RELAY_ENABLED' && e.value in ['false', 'true']) && object.spec.template.spec.containers[1].env.exists_one(e, e.name == 'POD_NAME' && e.valueFrom.fieldRef.fieldPath == 'metadata.name') && object.spec.template.spec.containers[1].env.exists_one(e, e.name == 'POD_UID' && e.valueFrom.fieldRef.fieldPath == 'metadata.uid') && object.spec.template.spec.containers[1].env.exists_one(e, e.name == 'PROOF_IMAGE' && e.value == 'ghcr.io/seung-ukk/vuln-mlops-runtime-client@sha256:556d3f1837edfcd0da44627a39dbe890822217c66b1beec2d31f5ff6c48a930b')", message: "The runtime relay identity and proof image are fixed."}
    - {expression: "object.spec.template.spec.containers[1].env.exists_one(e, e.name == 'RELAY_ENABLED' && ((e.value == 'false' && object.spec.template.spec.containers[0].env.exists_one(m, m.name == 'STAGE4_MODE' && m.value == 'baseline')) || (e.value == 'true' && object.spec.template.spec.containers[0].env.exists_one(m, m.name == 'STAGE4_MODE' && m.value == 'git-controlled') && object.spec.template.spec.containers[0].env.exists_one(m, m.name == 'STAGE5_MODE' && m.value == 'runtime-socket') && object.spec.template.metadata.annotations['lab.vuln-mlops/stage-04-proof'] == 'FLAG{stage_4_gitops_placeholder}')))", message: "The runtime relay is enabled only by the reviewed Stage 4 desired state."}
    - {expression: "object.spec.template.spec.containers.all(c, (!has(c.securityContext.privileged) || c.securityContext.privileged == false) && c.securityContext.allowPrivilegeEscalation == false && c.securityContext.readOnlyRootFilesystem == true) && object.spec.template.spec.initContainers.all(c, (!has(c.securityContext.privileged) || c.securityContext.privileged == false) && c.securityContext.allowPrivilegeEscalation == false && c.securityContext.readOnlyRootFilesystem == true)", message: "Privileged execution is forbidden."}
    - {expression: "object.spec.template.spec.volumes.size() == 4 && object.spec.template.spec.volumes.exists_one(v, v.name == 'runtime-socket' && has(v.hostPath) && v.hostPath.path == '/run/containerd/containerd.sock' && v.hostPath.type == 'Socket') && object.spec.template.spec.volumes.exists_one(v, v.name == 'tmp' && has(v.emptyDir)) && object.spec.template.spec.volumes.exists_one(v, v.name == 'tools' && has(v.emptyDir)) && object.spec.template.spec.volumes.exists_one(v, v.name == 'relay-code' && has(v.configMap) && v.configMap.name == 'runtime-relay')", message: "Only the exact runtime relay volumes are allowed."}
    - {expression: "!has(object.spec.template.spec.containers[0].volumeMounts) && object.spec.template.spec.containers[1].volumeMounts.size() == 4 && object.spec.template.spec.containers[1].volumeMounts.exists_one(v, v.name == 'runtime-socket' && v.mountPath == '/run/stage5/containerd.sock') && object.spec.template.spec.containers[1].volumeMounts.exists_one(v, v.name == 'tmp' && v.mountPath == '/tmp') && object.spec.template.spec.containers[1].volumeMounts.exists_one(v, v.name == 'tools' && v.mountPath == '/tools' && v.readOnly == true) && object.spec.template.spec.containers[1].volumeMounts.exists_one(v, v.name == 'relay-code' && v.mountPath == '/relay' && v.readOnly == true) && object.spec.template.spec.initContainers[0].volumeMounts.size() == 1 && object.spec.template.spec.initContainers[0].volumeMounts[0].name == 'tools' && object.spec.template.spec.initContainers[0].volumeMounts[0].mountPath == '/tools'", message: "Runtime relay mounts are fixed."}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: stage-05-runtime-builder-only}
spec: {policyName: stage-05-runtime-builder-only, validationActions: [Deny, Audit]}
