apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../stage-04-gitops
  - namespace.yaml
  - runtime-builder-base.yaml
  - ../runtime-relay
  - controller-rbac.yaml
  - participant-status-rbac.yaml
  - admission-policy.yaml
  - network-policy.yaml
patches:
  - path: argocd-stage5-patch.yaml
  - path: delete-stage4-runtime-builder.yaml
  - target: {kind: Deployment, name: argocd-server, namespace: stage-04-gitops}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 0}
