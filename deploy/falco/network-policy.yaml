apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: falco-observe
  namespace: falco-observe
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # The pinned container metadata plugin is fetched at Pod startup.
    # No lab namespace gains this egress permission.
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 443}
