apiVersion: v1
kind: Namespace
metadata:
  name: stage-01-canary
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-canary
  namespace: stage-01-canary
  labels: {lab.vuln-mlops/stage: "01"}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: lab-canary}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab-canary
        app.kubernetes.io/part-of: vuln-mlops-lab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: canary
          image: ghcr.io/seung-ukk/vuln-mlops:main
          imagePullPolicy: IfNotPresent
          command: [uvicorn]
          args: [modelgate.canary:app, --host, 0.0.0.0, --port, "9000"]
          ports: [{name: http, containerPort: 9000}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata: {name: lab-canary, namespace: stage-01-canary}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: lab-canary}
  ports: [{name: http, port: 9000, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: lab-canary, namespace: stage-01-canary}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: lab-canary}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: modelgate-lab}
          podSelector:
            matchLabels: {app.kubernetes.io/name: modelgate}
      ports: [{protocol: TCP, port: 9000}]
  egress: []
